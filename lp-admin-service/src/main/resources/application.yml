server:
  port: 8106

spring:
  application:
    name: admin-service
  # Nacos config centre placeholder. The client is not on the classpath yet, so these keys are
  # inert and the service always starts with the local defaults below. Once M1 adds
  # spring-cloud-alibaba-nacos-config, dataId lp-admin-service-{env}.yaml (group lp-group)
  # overrides them, and an unreachable Nacos server must not block startup.
  cloud:
    nacos:
      config:
        server-addr: ${LP_NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: ${LP_NACOS_GROUP:lp-group}
        namespace: ${LP_NACOS_NAMESPACE:dev}
        file-extension: yaml
        import-check:
          enabled: false

lp:
  admin:
    # course-service internal API address used by the review queue.
    course-base-url: ${LP_COURSE_SERVICE_BASE_URL:http://127.0.0.1:8102}
    course-read-timeout-ms: ${LP_COURSE_READ_TIMEOUT_MS:3000}
  internal:
    # Shared secret for /internal/v1/**. No default on purpose: the service refuses to start
    # without LP_INTERNAL_TOKEN so a misconfigured deployment never sends unauthenticated calls.
    token: ${LP_INTERNAL_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
