# 本地开发环境五件套：MySQL / Redis / RocketMQ / MinIO / Nacos
# 用法：cp infra/.env.example infra/.env && docker compose -f infra/docker-compose.yml up -d
# 说明：所有变量 LP_ 前缀；口令均为本地开发占位值，生产凭据仅经 K8s Secret 与 Nacos 加密配置下发。
name: lp-dev

# Shared runtime settings of every Java service. Profiles stay on dev so the local mock
# payment switch is allowed; prod/staging would abort startup when that switch is on.
x-service-env: &service-env
  TZ: ${LP_TIMEZONE:-Asia/Shanghai}
  SPRING_PROFILES_ACTIVE: ${LP_SPRING_PROFILES_ACTIVE:-dev}
  LP_INTERNAL_TOKEN: ${LP_INTERNAL_TOKEN:-lp_internal_dev_token}
  JAVA_TOOL_OPTIONS: ${LP_JAVA_TOOL_OPTIONS:--Xms128m -Xmx512m}

services:
  mysql:
    image: mysql:8.0.40
    container_name: lp-mysql
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LP_MYSQL_PORT:-3306}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${LP_MYSQL_ROOT_PASSWORD:-lp_root_dev}
      TZ: ${LP_TIMEZONE:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
    volumes:
      - lp-mysql-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"${LP_MYSQL_ROOT_PASSWORD:-lp_root_dev}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: lp-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LP_REDIS_PORT:-6379}:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - lp-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: lp-rocketmq-namesrv
    restart: unless-stopped
    # 镜像默认以 uid 3000(rocketmq) 运行，命名卷首次挂载属 root 不可写；本地开发直接以 root 运行
    user: "0:0"
    command: ["sh", "mqnamesrv"]
    ports:
      - "127.0.0.1:${LP_ROCKETMQ_NAMESRV_PORT:-9876}:9876"
    environment:
      TZ: ${LP_TIMEZONE:-Asia/Shanghai}
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    volumes:
      - lp-rocketmq-namesrv-logs:/home/rocketmq/logs
    healthcheck:
      # 镜像未把 bin 目录加入 PATH，必须用相对/绝对路径调用
      test: ["CMD-SHELL", "./mqadmin clusterList -n localhost:9876 >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 30s

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: lp-rocketmq-broker
    restart: unless-stopped
    # 同 namesrv：命名卷属 root，rocketmq 用户不可写，本地开发以 root 运行
    user: "0:0"
    command: ["sh", "mqbroker", "-n", "rocketmq-namesrv:9876", "-c", "/home/rocketmq/conf/broker.conf"]
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    ports:
      - "127.0.0.1:10909:10909"
      - "127.0.0.1:10911:10911"
    environment:
      TZ: ${LP_TIMEZONE:-Asia/Shanghai}
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn128m"
    volumes:
      - lp-rocketmq-broker-logs:/home/rocketmq/logs
      - lp-rocketmq-broker-store:/home/rocketmq/store
      - ./rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/10911' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 40s

  minio:
    # TODO(M1, 15.2 D14): 上游社区版 MinIO 已归档下线（dl.min.io 返回 410，minio/minio 镜像所有镜像站均 403/not found），
    # 当前依赖 bitnamilegacy/minio:2025.5.24 归档镜像（内部同一 MinIO Server 二进制）；M1 收尾前按压测与运维成本评估替代：
    # SeaweedFS / Garage / 云对象存储（决策登记见 docs/engineering-plan.md 15.2 D14）。届时同步更新 docs/local-dev-guide.md 的 MinIO 章节。
    image: bitnamilegacy/minio:2025.5.24
    container_name: lp-minio
    restart: unless-stopped
    # Bitnami 镜像默认 uid 1001，命名卷属 root 不可写；本地开发以 root 运行
    user: "0:0"
    # 绕过 Bitnami 的初始化脚本，直接以官方参数启动 MinIO Server
    entrypoint: ["/opt/bitnami/minio/bin/minio"]
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "127.0.0.1:${LP_MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${LP_MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${LP_MINIO_ROOT_USER:-lpminio}
      MINIO_ROOT_PASSWORD: ${LP_MINIO_ROOT_PASSWORD:-lp_minio_dev}
      TZ: ${LP_TIMEZONE:-Asia/Shanghai}
    volumes:
      - lp-minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  nacos:
    image: nacos/nacos-server:v2.5.3
    container_name: lp-nacos
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LP_NACOS_PORT:-8848}:8848"
      - "127.0.0.1:9848:9848"
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      TZ: ${LP_TIMEZONE:-Asia/Shanghai}
      JVM_XMS: "256m"
      JVM_XMX: "512m"
    volumes:
      - lp-nacos-data:/home/nacos/data
      - lp-nacos-logs:/home/nacos/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 30s

  # ---------------------------------------------------------------------------
  # Application services. Jars are produced on the host by scripts/dev-up.sh, so the
  # image build only copies an artifact. Business ports are bound to loopback only:
  # the browser always talks to the gateway, and direct service access is a local
  # debugging aid, never something the LAN should reach.
  # ---------------------------------------------------------------------------
  auth-service:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        JAR_FILE: lp-auth-service/target/lp-auth-service-0.1.0-SNAPSHOT.jar
    container_name: lp-auth-service
    restart: unless-stopped
    environment:
      <<: *service-env
      LP_AUTH_DB_URL: jdbc:mysql://mysql:3306/lp_ums?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      LP_REDIS_HOST: redis
      LP_REDIS_PORT: "6379"
      LP_JWT_PRIVATE_KEY_PATH: /run/jwt/jwt-private.pem
      LP_AUTH_TRADE_BASE_URL: ${LP_AUTH_TRADE_BASE_URL:-http://trade-service:8103}
      LP_AUTH_ACCOUNT_DELETION_EXECUTION_ENABLED: ${LP_AUTH_ACCOUNT_DELETION_EXECUTION_ENABLED:-false}
      LP_ANONYMIZE_SALT: ${LP_ANONYMIZE_SALT:-}
      LP_MINIAPP_LOGIN_ENABLED: ${LP_MINIAPP_LOGIN_ENABLED:-false}
      LP_MINIAPP_LOGIN_MOCK_ENABLED: ${LP_MINIAPP_LOGIN_MOCK_ENABLED:-false}
    volumes:
      - ./jwt:/run/jwt:ro
    ports:
      - "127.0.0.1:8101:8101"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8101' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  course-service:
    build:
      context: ..
      # Upload confirmation probes the stored video, so this image carries a static ffprobe.
      dockerfile: docker/course-service.Dockerfile
      args:
        JAR_FILE: lp-course-service/target/lp-course-service-0.1.0-SNAPSHOT.jar
        FFPROBE_IMAGE: ${LP_FFPROBE_IMAGE:-mwader/static-ffmpeg:7.1}
    container_name: lp-course-service
    restart: unless-stopped
    environment:
      <<: *service-env
      LP_COURSE_DB_URL: jdbc:mysql://mysql:3306/lp_cms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      LP_LEARN_BASE_URL: http://learn-service:8104
      LP_TRADE_BASE_URL: http://trade-service:8103
      # Confirmation reads the uploaded object back from inside the compose network, so the
      # endpoint must be the service name. The same host ends up in presigned PUT URLs handed to
      # the browser, see the MinIO section of docs/local-dev-guide.md.
      LP_COURSE_UPLOAD_MINIO_ENDPOINT: ${LP_COURSE_UPLOAD_MINIO_ENDPOINT:-http://minio:9000}
    ports:
      - "127.0.0.1:8102:8102"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8102' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  trade-service:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        JAR_FILE: lp-trade-service/target/lp-trade-service-0.1.0-SNAPSHOT.jar
    container_name: lp-trade-service
    restart: unless-stopped
    environment:
      <<: *service-env
      LP_TRADE_DB_URL: jdbc:mysql://mysql:3306/lp_oms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      LP_REDIS_HOST: redis
      LP_REDIS_PORT: "6379"
      LP_COURSE_SERVICE_BASE_URL: http://course-service:8102
      LP_LEARN_SERVICE_BASE_URL: http://learn-service:8104
      LP_AUTH_SERVICE_BASE_URL: http://auth-service:8101
      LP_WEB_BASE_URL: http://localhost:5173
      LP_PAY_MOCK_ENABLED: ${LP_PAY_MOCK_ENABLED:-false}
      LP_PAY_MOCK_SECRET: ${LP_PAY_MOCK_SECRET:-}
      LP_PAY_MOCK_GATEWAY_BASE_URL: http://localhost:8080
      # Alipay page pay stays off unless the sandbox credentials file is mounted and the
      # credentials are supplied by the operator; enabling it without them aborts startup.
      LP_PAY_ALIPAY_ENABLED: ${LP_PAY_ALIPAY_ENABLED:-false}
      LP_PAY_ALIPAY_CREDENTIALS_FILE: ${LP_PAY_ALIPAY_CREDENTIALS_FILE:-}
      LP_PAY_ALIPAY_GATEWAY_URL: ${LP_PAY_ALIPAY_GATEWAY_URL:-https://openapi-sandbox.dl.alipaydev.com/gateway.do}
      LP_PAY_ALIPAY_NOTIFY_URL: ${LP_PAY_ALIPAY_NOTIFY_URL:-}
    ports:
      - "127.0.0.1:8103:8103"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8103' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  learn-service:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        JAR_FILE: lp-learn-service/target/lp-learn-service-0.1.0-SNAPSHOT.jar
    container_name: lp-learn-service
    restart: unless-stopped
    environment:
      <<: *service-env
      LP_LEARN_DB_URL: jdbc:mysql://mysql:3306/lp_lms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
      LP_COURSE_SERVICE_BASE_URL: http://course-service:8102
      # Presigned URLs are opened by the browser, so the endpoint must be reachable from
      # the host as well. dev-up.sh fills this with the host LAN address when available.
      LP_MINIO_ENDPOINT: ${LP_MINIO_PUBLIC_ENDPOINT:-http://127.0.0.1:9000}
      LP_MINIO_ACCESS_KEY: ${LP_MINIO_ROOT_USER:-lpminio}
      LP_MINIO_SECRET_KEY: ${LP_MINIO_ROOT_PASSWORD:-lp_minio_dev}
      LP_MINIO_BUCKET: ${LP_MINIO_BUCKET:-lp-media}
    ports:
      - "127.0.0.1:8104:8104"
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8104' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  ugc-service:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        JAR_FILE: lp-ugc-service/target/lp-ugc-service-0.1.0-SNAPSHOT.jar
    container_name: lp-ugc-service
    restart: unless-stopped
    environment:
      <<: *service-env
    ports:
      - "127.0.0.1:8105:8105"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8105' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  admin-service:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        JAR_FILE: lp-admin-service/target/lp-admin-service-0.1.0-SNAPSHOT.jar
    container_name: lp-admin-service
    restart: unless-stopped
    environment:
      <<: *service-env
      LP_COURSE_SERVICE_BASE_URL: http://course-service:8102
      LP_TRADE_SERVICE_BASE_URL: http://trade-service:8103
      LP_AUTH_SERVICE_BASE_URL: http://auth-service:8101
    ports:
      - "127.0.0.1:8106:8106"
    depends_on:
      course-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8106' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  ai-service:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        JAR_FILE: lp-ai-service/target/lp-ai-service-0.1.0-SNAPSHOT.jar
    container_name: lp-ai-service
    restart: unless-stopped
    environment:
      <<: *service-env
    ports:
      - "127.0.0.1:8107:8107"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8107' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  gateway:
    build:
      context: ..
      dockerfile: docker/backend.Dockerfile
      args:
        JAR_FILE: lp-gateway/target/lp-gateway-0.1.0-SNAPSHOT.jar
    container_name: lp-gateway
    restart: unless-stopped
    environment:
      <<: *service-env
      LP_AUTH_SERVICE_URI: http://auth-service:8101
      LP_COURSE_SERVICE_URI: http://course-service:8102
      LP_TRADE_SERVICE_URI: http://trade-service:8103
      LP_LEARN_SERVICE_URI: http://learn-service:8104
      LP_UGC_SERVICE_URI: http://ugc-service:8105
      LP_ADMIN_SERVICE_URI: http://admin-service:8106
      LP_AI_SERVICE_URI: http://ai-service:8107
      LP_JWT_PUBLIC_KEY_PATH: /run/jwt/jwt-public.pem
      # Overridable so a local load run can raise the token bucket; the default
      # keeps the dev stack at the documented 300 requests per minute.
      LP_GATEWAY_RATE_LIMIT_PER_MINUTE: ${LP_GATEWAY_RATE_LIMIT_PER_MINUTE:-300}
    volumes:
      - ./jwt:/run/jwt:ro
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      auth-service:
        condition: service_healthy
      course-service:
        condition: service_healthy
      trade-service:
        condition: service_healthy
      learn-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    container_name: lp-web
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  admin:
    build:
      context: ..
      dockerfile: docker/admin.Dockerfile
    container_name: lp-admin
    restart: unless-stopped
    ports:
      - "127.0.0.1:5174:80"
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  lp-mysql-data:
  lp-redis-data:
  lp-rocketmq-namesrv-logs:
  lp-rocketmq-broker-logs:
  lp-rocketmq-broker-store:
  lp-minio-data:
  lp-nacos-data:
  lp-nacos-logs:
