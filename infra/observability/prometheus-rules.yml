# Alerting rules for the account cancellation execution job (SPEC-PLAT-004, L1-8).
# Only rules live here: no Grafana dashboards, no Alertmanager routes and no recording rules.
# Metric contract, threshold rationale and local verification: infra/observability/README.md
groups:
  - name: lp-auth-account-cancellation
    rules:
      - alert: LpAuthAccountCancellationExecuteFailed
        expr: |
          sum by (userId) (
            increase(lp_auth_account_cancellation_execute_failed_total[15m])
          ) >= 3
        for: 5m
        labels:
          severity: critical
          service: auth-service
          domain: account-cancellation
        annotations:
          summary: "Account cancellation keeps failing for userId {{ $labels.userId }}"
          description: >-
            The execution job retried the same account at least three times in fifteen minutes and
            every attempt rolled back. There is no retry cap by design, so the request stays due and
            the deletion never completes. Check auth-service logs for "account cancellation failed"
            (the reason names the dependency that broke), then the trade-service
            /internal/v1/account-deletion/anonymize endpoint and its database.
          runbook: "infra/observability/README.md"
      - alert: LpAuthAccountCancellationExecuteSkippedPersistent
        expr: |
          sum by (userId) (
            increase(lp_auth_account_cancellation_execute_skipped_total[24h])
          ) >= 48
        for: 10m
        labels:
          severity: warning
          service: auth-service
          domain: account-cancellation
        annotations:
          summary: "Account cancellation skipped 48 times in 24h for userId {{ $labels.userId }}"
          description: >-
            AC-12: the request stayed due for a full day of scans, so the account remains in the
            cooling-off state past its effective_at. Inspect the user's unfinished orders and refund
            requests in trade. The skip log line separates "blocked" from "already-claimed" (another
            replica won) and "status-changed" (the user withdrew first).
          runbook: "infra/observability/README.md"
      - alert: LpAuthAccountCancellationCacheInvalidateFailed
        expr: |
          sum (
            increase(lp_auth_account_cancellation_cache_invalidate_failed_total[15m])
          ) >= 3
        for: 5m
        labels:
          severity: warning
          service: auth-service
          domain: account-cancellation
        annotations:
          summary: "Trade cache invalidation keeps failing after account cancellation"
          description: >-
            AC-33: three failures in fifteen minutes means the after-commit invalidation call to
            trade is broken (trade unreachable, internal token rejected, or the endpoint missing).
            The counter carries no tags, so this is a service-wide rate, not one account. Trade
            keeps its cached "not cancelled" answer until the 45 s ttl expires, so a freshly
            cancelled account can still pass the purchase guard and only fail later at payment with
            67005. Check the auth-service WARN log, which carries userId, then trade
            /internal/v1/account-deletion/cache-invalidate.
          runbook: "infra/observability/README.md"
  - name: lp-course-cleanup
    rules:
      # A missing series is not a zero value: without this rule the two alerts below stay silent
      # exactly when the queue becomes unobservable (service down, scrape target removed). The
      # gauges are registered at startup, so ten minutes of absence means nobody is collecting.
      # The two alert rules below use a 30m window so a restart (which resets the gauges) and a
      # single slow tick do not page anyone.
      - alert: LpCourseCleanupMetricsMissing
        expr: absent(lp_course_cleanup_pending)
        for: 10m
        labels:
          severity: warning
          service: course-service
          domain: lesson-cleanup
        annotations:
          summary: "Lesson cleanup metrics are not being collected"
          description: >-
            No sample for lp_course_cleanup_pending for ten minutes: course-service is down, the
            scrape target is gone, or the actuator endpoint stopped exposing prometheus. The cleanup
            alerts cannot fire while the series is missing, so this rule covers that blind spot.
            Check the scrape targets and GET /actuator/prometheus on course-service.
          runbook: "docs/local-dev-guide.md"
      # Row-shaped threshold: a terminal row is never retried, so one row is already a defect that
      # needs a human. Counting rows instead of a rate avoids hiding a single stuck object behind
      # a quiet service.
      - alert: LpCourseCleanupFailedRows
        expr: lp_course_cleanup_failed_rows >= 1
        for: 30m
        labels:
          severity: warning
          service: course-service
          domain: lesson-cleanup
        annotations:
          summary: "Lesson cleanup has {{ $value }} terminal failures"
          description: >-
            A row reached FAILED after exhausting its retries or on a permanent error. The object may
            still exist in the bucket; last_error names the cause (for example NoSuchBucket means the
            bucket or endpoint is misconfigured, not that the file was deleted). Inspect
            lesson_content_cleanup where status=3, fix the cause, then reset those rows to status=0.
          runbook: "docs/local-dev-guide.md"
      # Duration-shaped threshold: the first one in this repository. The retry budget is about
      # 7.5 minutes by default (30s + 1m + 2m + 4m across four retries), so an attempted row older
      # than an hour cannot be waiting on backoff any more: either ticks stopped (service down, or
      # the switch turned off after the value was recorded) or storage rejects every delete. A
      # deliberately deferred row never spends an attempt, so it cannot trip this rule.
      - alert: LpCourseCleanupOldestRetrySeconds
        expr: lp_course_cleanup_oldest_seconds > 3600
        for: 30m
        labels:
          severity: warning
          service: course-service
          domain: lesson-cleanup
        annotations:
          summary: "Lesson cleanup retry stuck for {{ $value }} seconds"
          description: >-
            The oldest row that already spent an attempt has been waiting more than an hour, far
            beyond the retry budget, so retries are not progressing. Check that course-service is up
            and lp.course.cleanup.enabled is true, then look for repeated WARN "cleanup of ... failed"
            lines naming the storage error. Alerting stops refreshing while the switch is off, so a
            firing alert from before the switch will not clear by itself.
          runbook: "docs/local-dev-guide.md"
