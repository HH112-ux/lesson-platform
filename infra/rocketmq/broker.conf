# 本地开发 RocketMQ Broker 配置（挂载到 /home/rocketmq/conf/broker.conf）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
listenPort = 10911
# 本地开发允许自动建 Topic，便于骨架期冒烟
autoCreateTopicEnable = true
deleteWhen = 04
fileReservedTime = 48
flushDiskType = ASYNC_FLUSH
# 宿主机访问需要显式声明 broker 地址
brokerIP1 = 127.0.0.1
