# 本地开发 RocketMQ Broker 配置（挂载到 /home/rocketmq/conf/broker.conf）

# 集群与 Broker 身份
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerRole = ASYNC_MASTER

# 端口与注册地址（宿主机通过 127.0.0.1:10911 访问）
listenPort = 10911
brokerIP1 = 127.0.0.1

# 存储路径与刷盘策略
storePathRootDir = /home/rocketmq/store
flushDiskType = ASYNC_FLUSH
deleteWhen = 04
fileReservedTime = 48

# 本地开发允许自动建 Topic，便于骨架期冒烟
autoCreateTopicEnable = true
