server:
  port: 8103

spring:
  application:
    name: trade-service
  # The trade domain owns lp_oms. Local defaults match infra/docker-compose.yml (host port 3307).
  datasource:
    url: ${LP_TRADE_DB_URL:jdbc:mysql://127.0.0.1:3307/lp_oms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${LP_TRADE_DB_USERNAME:lp_app}
    password: ${LP_TRADE_DB_PASSWORD:lp_app_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  # Purchase tickets live in Redis under lp:trade:purchase-ticket:{sha256}; TTL 15 minutes.
  data:
    redis:
      host: ${LP_REDIS_HOST:127.0.0.1}
      port: ${LP_REDIS_PORT:6379}
      timeout: 2s
  servlet:
    multipart:
      # Reconciliation bills are uploaded as CSV; 50k rows stay well under this bound.
      max-file-size: 10MB
      max-request-size: 10MB
  # Schema history is managed by the flyway CLI (scripts/flyway.sh), not at application startup.
  # Nacos config centre placeholder. The client is not on the classpath yet, so these keys are
  # inert and the service always starts with the local defaults below. Once M1 adds
  # spring-cloud-alibaba-nacos-config, dataId lp-trade-service-{env}.yaml (group lp-group)
  # overrides them, and an unreachable Nacos server must not block startup.
  cloud:
    nacos:
      config:
        server-addr: ${LP_NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: ${LP_NACOS_GROUP:lp-group}
        namespace: ${LP_NACOS_NAMESPACE:dev}
        file-extension: yaml
        import-check:
          enabled: false

lp:
  identity:
    # Channel callbacks and anonymous ticket redemption are public; every other path must carry
    # the gateway injected identity. Signature checks stay inside the services.
    whitelist: ${LP_IDENTITY_WHITELIST:/api/v1/payments/alipay/notify,/api/v1/payments/mock/callback,/api/v1/orders/purchase-ticket/redeem}
  trade:
    # course-service internal read API; it is never routed through the gateway.
    course-base-url: ${LP_COURSE_SERVICE_BASE_URL:http://127.0.0.1:8102}
    course-read-timeout: ${LP_COURSE_SERVICE_READ_TIMEOUT:2s}
    # learn-service internal entitlement API, called only by the outbox relay.
    learn-base-url: ${LP_LEARN_SERVICE_BASE_URL:http://127.0.0.1:8104}
    learn-read-timeout: ${LP_LEARN_SERVICE_READ_TIMEOUT:2s}
    # Eventual consistency window: a pending grant is delivered within one relay delay.
    outbox-relay-delay-ms: ${LP_ENTITLEMENT_RELAY_DELAY_MS:5000}
    outbox-max-retries: ${LP_ENTITLEMENT_MAX_RETRIES:10}
    # Browser base URL used in the purchase ticket deep link. Never hardcode a domain in code.
    web-base-url: ${LP_WEB_BASE_URL:http://127.0.0.1:5173}
    # auth-service internal session API, called after a ticket is redeemed.
    auth-base-url: ${LP_AUTH_SERVICE_BASE_URL:http://127.0.0.1:8101}
    # Cooling-off state query sits on the checkout path: 200 ms keeps a slow auth from delaying
    # the buyer, and a failed probe refuses the purchase instead of guessing.
    auth-state-read-timeout: ${LP_AUTH_STATE_READ_TIMEOUT:200ms}
    # Per user cache of that answer. Also the worst case window when auth's active invalidation
    # call fails; 45 s bounds the mistake without quadrupling the probe rate.
    account-guard-cache-ttl: ${LP_ACCOUNT_GUARD_CACHE_TTL:45s}
  internal:
    # Shared secret for /internal/v1/**; no default, so a missing LP_INTERNAL_TOKEN fails startup.
    token: ${LP_INTERNAL_TOKEN}
  pay:
    # Local mock payment provider. Development only: enabling it on prod or staging aborts
    # startup (MockPayProfileGuard). Callbacks are still HMAC verified by MockSignatureVerifier;
    # only the signer lives on the local machine.
    mock:
      enabled: ${LP_PAY_MOCK_ENABLED:false}
      # No default: enabling the mock channel without a secret fails startup.
      secret: ${LP_PAY_MOCK_SECRET:}
      gateway-base-url: ${LP_PAY_MOCK_GATEWAY_BASE_URL:http://127.0.0.1:8080}
    # Alipay openapi channel. Credentials are never copied here: the loader reads the verified
    # credential file directly at startup, and a missing or incomplete file aborts the boot. The
    # sandbox gateway is refused on prod/staging.
    alipay:
      enabled: ${LP_PAY_ALIPAY_ENABLED:false}
      credentials-file: ${LP_PAY_ALIPAY_CREDENTIALS_FILE:}
      gateway-url: ${LP_PAY_ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}

# Only health, info and prometheus are exposed. The prometheus endpoint is served on the service
# port (8103), which the gateway does not route: nginx forwards /actuator to the gateway's own
# actuator only, so scrapers reach trade-service on the cluster network, never through the public
# edge. Keep this list closed; do not add env, beans or heapdump here.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
