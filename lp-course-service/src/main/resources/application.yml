server:
  port: 8102

spring:
  application:
    name: course-service
  # The course domain owns lp_cms. Local defaults match infra/docker-compose.yml (host port 3307).
  datasource:
    url: ${LP_COURSE_DB_URL:jdbc:mysql://127.0.0.1:3307/lp_cms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${LP_COURSE_DB_USERNAME:lp_app}
    password: ${LP_COURSE_DB_PASSWORD:lp_app_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  # Schema history is managed by the flyway CLI (scripts/flyway.sh), not at application startup.
  # Nacos config centre placeholder. The client is not on the classpath yet, so these keys are
  # inert and the service always starts with the local defaults below. Once M1 adds
  # spring-cloud-alibaba-nacos-config, dataId lp-course-service-{env}.yaml (group lp-group)
  # overrides them, and an unreachable Nacos server must not block startup.
  cloud:
    nacos:
      config:
        server-addr: ${LP_NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: ${LP_NACOS_GROUP:lp-group}
        namespace: ${LP_NACOS_NAMESPACE:dev}
        file-extension: yaml
        import-check:
          enabled: false

lp:
  identity:
    # Public catalogue reads. Every other path must carry the gateway injected identity.
    whitelist: ${LP_IDENTITY_WHITELIST:/api/v1/courses/**,/api/v1/categories/**}
  internal:
    # Shared secret for /internal/v1/**; no default, so a missing LP_INTERNAL_TOKEN fails startup.
    token: ${LP_INTERNAL_TOKEN}
  course:
    # Used only to fill the catalog owned flag; failures degrade to anonymous.
    learn-base-url: ${LP_LEARN_BASE_URL:http://127.0.0.1:8104}
    learn-read-timeout-ms: ${LP_LEARN_READ_TIMEOUT_MS:2000}
    # Locks lesson deletion once a course is sold; an unreachable trade service never allows it.
    trade-base-url: ${LP_TRADE_BASE_URL:http://127.0.0.1:8103}
    trade-read-timeout-ms: ${LP_COURSE_TRADE_READ_TIMEOUT_MS:2000}
    upload:
      # Presigned PUT credentials are short lived on purpose: they are issued per session.
      session-ttl: ${LP_COURSE_UPLOAD_SESSION_TTL:30m}
      # Lifetime of a presigned GET credential handed to the owning teacher for preview. Capped at
      # one hour by CourseUploadSettingsValidator so a copied URL is not a reusable handle.
      play-url-ttl: ${LP_COURSE_UPLOAD_PLAY_URL_TTL:10m}
      # Sole runtime ceiling; the API rejects larger files before insert. Mirrors
      # chk_lesson_upload_size in db/migration/course/V9__lesson_upload_size_limit.sql.
      # Change both together, the constraint needs a new migration.
      max-size-bytes: ${LP_COURSE_UPLOAD_MAX_SIZE_BYTES:2147483648}
      minio-endpoint: ${LP_COURSE_UPLOAD_MINIO_ENDPOINT:${LP_MINIO_ENDPOINT:http://127.0.0.1:9000}}
      # Fixed so presigning needs no network call; the endpoint above is browser facing.
      minio-region: ${LP_COURSE_UPLOAD_MINIO_REGION:${LP_MINIO_REGION:us-east-1}}
      # No credential fallback here: application-dev.yml owns the local values, and
      # CourseUploadSettingsValidator fails startup when a non-dev profile resolves to one.
      minio-access-key: ${LP_COURSE_UPLOAD_MINIO_ACCESS_KEY:}
      minio-secret-key: ${LP_COURSE_UPLOAD_MINIO_SECRET_KEY:}
      minio-bucket: ${LP_COURSE_UPLOAD_MINIO_BUCKET:${LP_MINIO_BUCKET:lp-media}}
    # Asynchronous standardization of confirmed lesson videos. The source file stays playable, so a
    # disabled or failed transcode never blocks review or playback.
    transcode:
      enabled: ${LP_COURSE_TRANSCODE_ENABLED:true}
      # CPU bound work: keep the pool small and let the bounded queue absorb upload bursts.
      concurrency: ${LP_COURSE_TRANSCODE_CONCURRENCY:2}
      queue-capacity: ${LP_COURSE_TRANSCODE_QUEUE_CAPACITY:64}
      ffmpeg-path: ${LP_COURSE_TRANSCODE_FFMPEG_PATH:ffmpeg}
      timeout: ${LP_COURSE_TRANSCODE_TIMEOUT:2h}
      max-attempts: ${LP_COURSE_TRANSCODE_MAX_ATTEMPTS:3}
      retry-backoff: ${LP_COURSE_TRANSCODE_RETRY_BACKOFF:5s}
      download-timeout: ${LP_COURSE_TRANSCODE_DOWNLOAD_TIMEOUT:30m}
      upload-timeout: ${LP_COURSE_TRANSCODE_UPLOAD_TIMEOUT:30m}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
