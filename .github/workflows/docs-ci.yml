name: docs-ci

on:
  # Any pull request branch runs the checks, including stacked pull requests whose base is a
  # feature branch. Push and merge queue triggers stay limited to develop and main.
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - develop
      - main
  merge_group:
  # Allows the required checks to be re-run on main without a new commit.
  workflow_dispatch:

jobs:
  docs-check:
    name: docs-check
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 文档规范校验
        run: bash scripts/check-docs.sh

      - name: 提交信息校验
        run: |
          set -e
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
            for sha in $(git rev-list "$base".."$head"); do
              git log -1 --pretty=%B "$sha" > /tmp/commit-msg.txt
              bash scripts/check-commit-msg.sh /tmp/commit-msg.txt "$sha"
            done
          else
            head="$(git rev-parse HEAD)"
            git log -1 --pretty=%B "$head" > /tmp/commit-msg.txt
            bash scripts/check-commit-msg.sh /tmp/commit-msg.txt "$head"
          fi

      # Squash merge turns the PR title into the commit on develop, so the title
      # has to pass the same check as a hand written commit message.
      - name: PR 标题校验
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -e
          printf '%s\n' "$PR_TITLE" > /tmp/pr-title.txt
          bash scripts/check-commit-msg.sh /tmp/pr-title.txt
