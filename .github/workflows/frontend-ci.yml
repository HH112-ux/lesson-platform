name: frontend-ci

on:
  # Any pull request branch runs the checks, including stacked pull requests whose base is a
  # feature branch. Push and merge queue triggers stay limited to develop and main.
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - develop
      - main
  merge_group:
  # Allows the required checks to be re-run on main without a new commit.
  workflow_dispatch:

jobs:
  frontend-check:
    name: frontend-check
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 代码规范
        run: pnpm -r --if-present lint

      - name: 类型检查
        run: pnpm -r --if-present typecheck

      - name: 单元测试
        run: pnpm -r --if-present test

      - name: 构建
        run: pnpm -r --if-present build

  miniapp-check:
    name: miniapp-check
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 小程序静态校验
        run: node apps/miniapp/scripts/check.mjs
