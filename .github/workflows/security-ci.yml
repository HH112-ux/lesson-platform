name: security-ci

on:
  # Manual and nightly only. Deliberately no pull_request, push or merge_group: the
  # identity drill keeps one FAIL on purpose (a direct service call with forged
  # identity headers, registered in docs/project-status.md 4.2), so this file must
  # never become a required check that blocks merges.
  schedule:
    - cron: '0 20 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  # infra/.env is gitignored, so CI must not inherit the mock pay switch from a laptop.
  LP_PAY_MOCK_ENABLED: 'true'

jobs:
  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 准备本地环境变量
        run: |
          cp infra/.env.example infra/.env
          sed -i "s/^LP_PAY_MOCK_ENABLED=.*/LP_PAY_MOCK_ENABLED=${LP_PAY_MOCK_ENABLED}/" infra/.env
          grep '^LP_PAY_MOCK_ENABLED=' infra/.env

      - name: 起栈并灌演示数据
        run: bash scripts/dev-up.sh

      - name: 身份与鉴权越权断言
        continue-on-error: true
        run: bash scripts/security/authz-drill.sh 2>&1 | tee /tmp/authz-drill.log

      - name: 交易与回调断言
        continue-on-error: true
        run: bash scripts/security/payment-drill.sh 2>&1 | tee /tmp/payment-drill.log

      - name: 安全响应头断言
        continue-on-error: true
        run: bash scripts/security-headers-check.sh 2>&1 | tee /tmp/security-headers.log

      - name: 判定断言结果
        run: |
          set -uo pipefail
          fail_of() {
            sed -n 's/^SUMMARY pass=[0-9]* fail=\([0-9]*\)$/\1/p' "$1" | tail -1
          }
          grep -h '^SUMMARY' /tmp/authz-drill.log /tmp/payment-drill.log \
            /tmp/security-headers.log || true
          status=0
          authz_fail="$(fail_of /tmp/authz-drill.log)"
          payment_fail="$(fail_of /tmp/payment-drill.log)"
          headers_fail="$(fail_of /tmp/security-headers.log)"
          if [ -z "${authz_fail}" ] || [ -z "${payment_fail}" ] || [ -z "${headers_fail}" ]; then
            echo "ERROR 有演练没有输出 SUMMARY 行，视为脚本自身失败。" >&2
            status=1
          fi
          # One FAIL is the registered architecture gap (docs/project-status.md 4.2):
          # business services trust the gateway identity headers. More than one means a
          # new regression and fails the run.
          if [ -n "${authz_fail}" ] && [ "${authz_fail}" -gt 1 ]; then
            echo "ERROR 越权演练回归：fail=${authz_fail}，只允许 4.2 登记的那一条缺口。" >&2
            status=1
          fi
          if [ -n "${payment_fail}" ] && [ "${payment_fail}" -ne 0 ]; then
            echo "ERROR 交易与回调演练 fail=${payment_fail}。" >&2
            status=1
          fi
          if [ -n "${headers_fail}" ] && [ "${headers_fail}" -ne 0 ]; then
            echo "ERROR 安全响应头检查 fail=${headers_fail}。" >&2
            status=1
          fi
          exit "${status}"

      - name: 收集失败取证
        if: failure()
        run: |
          bash scripts/e2e-forensics.sh || true
          mkdir -p forensics
          cp /tmp/*-drill.log /tmp/security-headers.log forensics/ 2>/dev/null || true

      - name: 上传失败取证
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: security-forensics
          path: forensics/
          retention-days: 7
