name: release-images

# Builds the release images for the backend services, the student web app and the
# operations console. This workflow is intentionally NOT wired into pull_request,
# push to develop/main or merge_group: it must never become a required PR check and
# must never change the coverage of backend-build / backend-test / frontend-check.
#
# Registry resolution (no extra secret is required for the default path):
#   - REGISTRY + REGISTRY_USERNAME + REGISTRY_PASSWORD all set  -> that registry
#     (Docker Hub, Aliyun ACR, ...) with those credentials.
#   - all three empty -> ghcr.io, authenticated with the repository GITHUB_TOKEN
#     (requires permissions: packages: write). The owner is lower-cased because
#     ghcr rejects upper-case repository owners.
#   - only some of the three set -> hard error, so a half-configured registry can
#     never silently push to the wrong place.
#
# Push is enabled for release tags (v*) and for a manual dispatch with push=true.
# A dispatch with push=false performs a build-only dry run so the Dockerfiles can be
# verified without touching any registry.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      push:
        description: 'Push images to the registry (false = build-only dry run)'
        required: true
        type: boolean
        default: true
      service:
        description: 'Build only this image (e.g. lp-course-service; empty = all images)'
        required: false
        type: string
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  group: release-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  registry-preflight:
    name: registry-preflight
    runs-on: ubuntu-latest
    outputs:
      registry: ${{ steps.config.outputs.registry }}
      image_repo: ${{ steps.config.outputs.image_repo }}
      image_tag: ${{ steps.config.outputs.image_tag }}
      push_enabled: ${{ steps.config.outputs.push_enabled }}
      has_backend: ${{ steps.matrix.outputs.has_backend }}
      has_frontend: ${{ steps.matrix.outputs.has_frontend }}
      backend_matrix: ${{ steps.matrix.outputs.backend_matrix }}
      frontend_matrix: ${{ steps.matrix.outputs.frontend_matrix }}
    steps:
      - name: 校验镜像仓库配置
        id: config
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PUSH: ${{ inputs.push }}
          REGISTRY: ${{ secrets.REGISTRY }}
          REGISTRY_USERNAME: ${{ secrets.REGISTRY_USERNAME }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          if [ "${EVENT_NAME}" = "workflow_dispatch" ] && [ "${INPUT_PUSH}" = "false" ]; then
            push_enabled=false
          else
            push_enabled=true
          fi

          configured=0
          if [ -n "${REGISTRY}" ]; then configured=$((configured + 1)); fi
          if [ -n "${REGISTRY_USERNAME}" ]; then configured=$((configured + 1)); fi
          if [ -n "${REGISTRY_PASSWORD}" ]; then configured=$((configured + 1)); fi

          if [ "${configured}" -eq 3 ]; then
            registry="${REGISTRY}"
            echo "::notice::使用自定义镜像仓库 ${registry}。"
          elif [ "${configured}" -eq 0 ]; then
            owner_lc="$(printf '%s' "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
            registry="ghcr.io"
            echo "::notice::未配置 REGISTRY/REGISTRY_USERNAME/REGISTRY_PASSWORD，回落到 ghcr.io/${owner_lc}，使用 GITHUB_TOKEN 认证。"
          else
            missing=""
            [ -n "${REGISTRY}" ] || missing="${missing} secrets.REGISTRY"
            [ -n "${REGISTRY_USERNAME}" ] || missing="${missing} secrets.REGISTRY_USERNAME"
            [ -n "${REGISTRY_PASSWORD}" ] || missing="${missing} secrets.REGISTRY_PASSWORD"
            echo "::error::镜像仓库凭据只配置了一部分，缺少:${missing}。三个都配齐走自定义仓库，三个都留空走 ghcr；不允许半配置。"
            exit 1
          fi

          if [ "${push_enabled}" = "true" ]; then
            if [ "${registry}" = "ghcr.io" ]; then
              owner_lc="$(printf '%s' "${REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
              image_repo="ghcr.io/${owner_lc}"
            else
              image_repo="${registry}"
            fi
          else
            image_repo="local"
            echo "::notice::push=false，仅构建镜像不推送；未读取 registry 凭据。"
          fi

          if [ "${REF_TYPE}" = "tag" ]; then
            image_tag="${REF_NAME}"
          else
            image_tag="${SHA:0:12}"
          fi

          {
            echo "registry=${registry}"
            echo "image_repo=${image_repo}"
            echo "image_tag=${image_tag}"
            echo "push_enabled=${push_enabled}"
          } >> "${GITHUB_OUTPUT}"

      - name: 计算目标镜像矩阵
        id: matrix
        env:
          SERVICE: ${{ inputs.service }}
        run: |
          set -euo pipefail

          backend_rows="lp-gateway lp-gateway docker/backend.Dockerfile
          lp-auth-service lp-auth-service docker/backend.Dockerfile
          lp-course-service lp-course-service docker/course-service.Dockerfile
          lp-trade-service lp-trade-service docker/backend.Dockerfile
          lp-learn-service lp-learn-service docker/backend.Dockerfile
          lp-ugc-service lp-ugc-service docker/backend.Dockerfile
          lp-admin-service lp-admin-service docker/backend.Dockerfile
          lp-ai-service lp-ai-service docker/backend.Dockerfile"
          frontend_rows="lp-web lp-web docker/web.Dockerfile
          lp-admin lp-admin docker/admin.Dockerfile"

          if [ -n "${SERVICE}" ]; then
            backend_rows="$(printf '%s\n' "${backend_rows}" | awk -v s="${SERVICE}" 'NF && $1 == s')"
            frontend_rows="$(printf '%s\n' "${frontend_rows}" | awk -v s="${SERVICE}" 'NF && $1 == s')"
            if [ -z "${backend_rows}" ] && [ -z "${frontend_rows}" ]; then
              echo "::error::未知 service='${SERVICE}'。可选值：lp-gateway lp-auth-service lp-course-service lp-trade-service lp-learn-service lp-ugc-service lp-admin-service lp-ai-service lp-web lp-admin。"
              exit 1
            fi
            echo "::notice::只构建 service='${SERVICE}'。"
          fi

          to_json() {
            rows="$1"
            pkg_key="$2"
            out=""
            while read -r image second dockerfile; do
              [ -n "${image}" ] || continue
              [ -n "${out}" ] && out="${out},"
              out="${out}{\"image\":\"${image}\",\"${pkg_key}\":\"${second}\",\"dockerfile\":\"${dockerfile}\"}"
            done <<< "${rows}"
            printf '[%s]' "${out}"
          }

          if [ -n "${backend_rows}" ]; then has_backend=true; else has_backend=false; fi
          if [ -n "${frontend_rows}" ]; then has_frontend=true; else has_frontend=false; fi

          {
            echo "has_backend=${has_backend}"
            echo "has_frontend=${has_frontend}"
            echo "backend_matrix=$(to_json "${backend_rows}" module)"
            echo "frontend_matrix=$(to_json "${frontend_rows}" package)"
          } >> "${GITHUB_OUTPUT}"

  backend-image:
    name: backend-image-${{ matrix.image }}
    needs: registry-preflight
    if: needs.registry-preflight.outputs.has_backend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.registry-preflight.outputs.backend_matrix) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 构建服务 jar
        run: ./mvnw -B -q -DskipTests -pl "${{ matrix.module }}" -am package

      - name: 解析 jar 路径
        id: jar
        run: |
          set -euo pipefail
          jar_path="$(find "${{ matrix.module }}/target" -maxdepth 1 -type f -name '*.jar' \
            ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*.original' | head -n 1)"
          if [ -z "${jar_path}" ]; then
            echo "::error::${{ matrix.module }} 未产出可执行 jar"
            exit 1
          fi
          echo "path=${jar_path}" >> "${GITHUB_OUTPUT}"

      - name: 登录自定义镜像仓库
        if: needs.registry-preflight.outputs.push_enabled == 'true' && needs.registry-preflight.outputs.registry != 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.registry-preflight.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 登录 GitHub 容器镜像库
        if: needs.registry-preflight.outputs.push_enabled == 'true' && needs.registry-preflight.outputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: |
            JAR_FILE=${{ steps.jar.outputs.path }}
          push: ${{ needs.registry-preflight.outputs.push_enabled }}
          tags: ${{ needs.registry-preflight.outputs.image_repo }}/${{ matrix.image }}:${{ needs.registry-preflight.outputs.image_tag }}

      - name: 输出镜像摘要
        if: needs.registry-preflight.outputs.push_enabled == 'true'
        run: |
          echo "image=${{ needs.registry-preflight.outputs.image_repo }}/${{ matrix.image }}:${{ needs.registry-preflight.outputs.image_tag }}"
          echo "digest=${{ steps.build.outputs.digest }}"

  frontend-image:
    name: frontend-image-${{ matrix.image }}
    needs: registry-preflight
    if: needs.registry-preflight.outputs.has_frontend == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.registry-preflight.outputs.frontend_matrix) }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建前端产物
        run: pnpm --filter "${{ matrix.package }}" build

      - name: 登录自定义镜像仓库
        if: needs.registry-preflight.outputs.push_enabled == 'true' && needs.registry-preflight.outputs.registry != 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ${{ needs.registry-preflight.outputs.registry }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: 登录 GitHub 容器镜像库
        if: needs.registry-preflight.outputs.push_enabled == 'true' && needs.registry-preflight.outputs.registry == 'ghcr.io'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ needs.registry-preflight.outputs.push_enabled }}
          tags: ${{ needs.registry-preflight.outputs.image_repo }}/${{ matrix.image }}:${{ needs.registry-preflight.outputs.image_tag }}

      - name: 输出镜像摘要
        if: needs.registry-preflight.outputs.push_enabled == 'true'
        run: |
          echo "image=${{ needs.registry-preflight.outputs.image_repo }}/${{ matrix.image }}:${{ needs.registry-preflight.outputs.image_tag }}"
          echo "digest=${{ steps.build.outputs.digest }}"
