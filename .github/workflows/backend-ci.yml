name: backend-ci

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop

jobs:
  backend-build:
    name: backend-build
    runs-on: ubuntu-latest
    steps:
      # Spotless ratchetFrom('origin/develop') needs the full history and the
      # origin/develop ref, which a shallow checkout does not provide.
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 格式校验
        run: ./mvnw -B -q spotless:check

      - name: 编译打包
        run: ./mvnw -B -q -DskipTests package

  backend-test:
    name: backend-test
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: 单元测试
        run: ./mvnw -B test
