server:
  port: 8104

spring:
  application:
    name: learn-service
  # The learning domain owns lp_lms. Local defaults match infra/docker-compose.yml (host port 3307).
  datasource:
    url: ${LP_LEARN_DB_URL:jdbc:mysql://127.0.0.1:3307/lp_lms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${LP_LEARN_DB_USERNAME:lp_app}
    password: ${LP_LEARN_DB_PASSWORD:lp_app_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  # Schema history is managed by the flyway CLI (scripts/flyway.sh), not at application startup.
  # Nacos config centre placeholder. The client is not on the classpath yet, so these keys are
  # inert and the service always starts with the local defaults below. Once M1 adds
  # spring-cloud-alibaba-nacos-config, dataId lp-learn-service-{env}.yaml (group lp-group)
  # overrides them, and an unreachable Nacos server must not block startup.
  cloud:
    nacos:
      config:
        server-addr: ${LP_NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: ${LP_NACOS_GROUP:lp-group}
        namespace: ${LP_NACOS_NAMESPACE:dev}
        file-extension: yaml
        import-check:
          enabled: false

lp:
  learn:
    # course-service internal read API; it is never routed through the gateway.
    course-base-url: ${LP_COURSE_SERVICE_BASE_URL:http://127.0.0.1:8102}
    course-read-timeout: ${LP_COURSE_SERVICE_READ_TIMEOUT:2s}
    # Playback URLs are signed by learn-service; the client never receives the object key.
    play-token-ttl: ${LP_PLAY_TOKEN_TTL:10m}
    minio-endpoint: ${LP_MINIO_ENDPOINT:http://127.0.0.1:9000}
    # Local defaults mirror infra/docker-compose.yml; production values come from K8s Secret.
    minio-access-key: ${LP_MINIO_ACCESS_KEY:${LP_MINIO_ROOT_USER:lpminio}}
    minio-secret-key: ${LP_MINIO_SECRET_KEY:${LP_MINIO_ROOT_PASSWORD:lp_minio_dev}}
    minio-bucket: ${LP_MINIO_BUCKET:lp-media}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
