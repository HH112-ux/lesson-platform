# Public listener of the operations and teacher console.
#
# Placement: /etc/nginx/sites-available/lp-admin.conf (symlinked into sites-enabled).
# The container itself stays on loopback (127.0.0.1:15175) and is reached through this
# block, so every hardening measure lives here and the admin image needs no rebuild.
#
# Companion file: lp-admin-ratelimit.conf, which must be loaded in the http context
# (for example /etc/nginx/conf.d/lp-admin-ratelimit.conf) because limit_req_zone is only
# valid there.
server {
    listen 15174;
    listen [::]:15174;
    server_name _;
    server_tokens off;
    client_max_body_size 2m;
    autoindex off;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    proxy_hide_header Server;
    proxy_hide_header X-Powered-By;

    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /api/v1/auth/login {
        limit_req zone=lp_admin_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:15175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        proxy_pass http://127.0.0.1:15175;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
