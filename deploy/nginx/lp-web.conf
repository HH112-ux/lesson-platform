# Host-level reverse proxy and TLS terminator for the student web app.
#
# Placement: /etc/nginx/conf.d/lp-web.conf on the host, next to the stock nginx.conf.
# Certificates: /etc/letsencrypt/live/lp.example.com/{fullchain,privkey}.pem, issued by
# certbot. Certificates and account keys are never committed; only this template is.
#
# One-time issue (nginx must already serve the HTTP block below):
#   sudo certbot certonly --webroot -w /var/www/certbot -d lp.example.com
# Renewal is handled by the certbot systemd timer; reload nginx afterwards:
#   sudo systemctl reload nginx
#
# Replace lp.example.com with the real domain before enabling the site.
server {
    listen 80;
    server_name lp.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name lp.example.com;

    ssl_certificate     /etc/letsencrypt/live/lp.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lp.example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    client_max_body_size 8m;

    # Course videos. LP_MINIO_PUBLIC_ENDPOINT must be https://lp.example.com so the
    # presigned URL keeps the bucket in the path (/lp-media/<key>) and stays same-origin;
    # with that setting the SigV4 signature survives the extra proxy hop unchanged.
    location /lp-media/ {
        proxy_pass http://127.0.0.1:19000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass http://127.0.0.1:15173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
