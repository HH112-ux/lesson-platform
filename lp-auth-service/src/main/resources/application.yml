server:
  port: 8101

spring:
  application:
    name: auth-service
  # The auth domain owns lp_ums. Local defaults match infra/docker-compose.yml (host port 3307).
  datasource:
    url: ${LP_AUTH_DB_URL:jdbc:mysql://127.0.0.1:3307/lp_ums?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}
    username: ${LP_AUTH_DB_USERNAME:lp_app}
    password: ${LP_AUTH_DB_PASSWORD:lp_app_dev}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
  # Refresh tokens are stored in Redis under lp:auth:refresh:{sha256(token)}. Login, refresh
  # and logout fail with 50001 when Redis is unreachable; they never fall back to an
  # unvalidated token. Local containers expose 6379 (see infra/docker-compose.yml).
  data:
    redis:
      host: ${LP_REDIS_HOST:127.0.0.1}
      port: ${LP_REDIS_PORT:6379}
      timeout: 2s
  # Schema history is managed by the flyway CLI (scripts/flyway.sh), not at application startup.
  # Nacos config centre placeholder. The client is not on the classpath yet, so these keys are
  # inert and the service always starts with the local defaults below. Once M1 adds
  # spring-cloud-alibaba-nacos-config, dataId lp-auth-service-{env}.yaml (group lp-group) overrides
  # them, and an unreachable Nacos server must not block startup.
  cloud:
    nacos:
      config:
        server-addr: ${LP_NACOS_SERVER_ADDR:127.0.0.1:8848}
        group: ${LP_NACOS_GROUP:lp-group}
        namespace: ${LP_NACOS_NAMESPACE:dev}
        file-extension: yaml
        import-check:
          enabled: false

lp:
  internal:
    # Shared secret for /internal/v1/**; no default, so a missing LP_INTERNAL_TOKEN fails startup.
    token: ${LP_INTERNAL_TOKEN}
  auth:
    jwt:
      issuer: auth-service
      access-token-ttl-seconds: 900
      refresh-token-ttl-seconds: 604800
      # Generated by scripts/gen-jwt-keys.sh into infra/jwt (gitignored). Startup fails when blank.
      private-key-path: ${LP_JWT_PRIVATE_KEY_PATH:}
    # Miniapp code login stays off until an AppSecret exists. Never commit the secret; supply it
    # through LP_MINIAPP_APP_SECRET. mock-enabled maps every code to a deterministic openid and
    # must stay false outside local and test runs.
    miniapp:
      enabled: ${LP_MINIAPP_LOGIN_ENABLED:false}
      mock-enabled: ${LP_MINIAPP_LOGIN_MOCK_ENABLED:false}
      app-id: ${LP_MINIAPP_APP_ID:}
      app-secret: ${LP_MINIAPP_APP_SECRET:}
    # Per IP backstop plus 5/min per device. Redis outages fail open with a WARN and the
    # lp.auth.miniapp_login.rate_limit.degraded metric; counters restart at zero after recovery.
    miniapp-login-rate-limit:
      ip-limit: ${LP_MINIAPP_LOGIN_IP_LIMIT:30}
      device-limit: ${LP_MINIAPP_LOGIN_DEVICE_LIMIT:5}
      window-seconds: ${LP_MINIAPP_LOGIN_WINDOW_SECONDS:60}
      trusted-proxies: ${LP_TRUSTED_PROXIES:127.0.0.1,::1}
    # Account cancellation (SPEC-PLAT-004). The blocker probe calls the trade-service internal API
    # and fails closed with 50401 when trade is unreachable, so no order is hidden by an outage.
    account-deletion:
      trade-base-url: ${LP_AUTH_TRADE_BASE_URL:http://127.0.0.1:8103}
      trade-read-timeout: ${LP_AUTH_TRADE_READ_TIMEOUT:2s}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
