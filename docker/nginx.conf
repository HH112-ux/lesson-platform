# Static SPA host that forwards API calls to the gateway, so the browser stays
# same-origin exactly like the Vite dev server proxy does.
#
# Security headers live on the server block so they also apply to proxied API
# responses (nginx keeps them unless a location sets its own add_header).
# Content-Security-Policy starts from a permissive baseline: scripts fall back
# to default-src 'self' (no explicit script-src yet), Vue inline styles are
# allowed, and media/connect allow https plus the local MinIO origin used by
# presigned course videos and direct uploads. The presigned host here is
# http://minio:9000; production must add its own public media domain before
# release, otherwise playback and uploads are blocked by CSP.
# form-action names the Alipay gateway explicitly: the payment page is posted as
# a cross-origin form, so 'self' alone would block every payment attempt.
server {
    listen 80;
    server_name _;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob: https: http://minio:9000 http://127.0.0.1:9000 http://localhost:9000; media-src 'self' blob: https: http://minio:9000 http://127.0.0.1:9000 http://localhost:9000; connect-src 'self' http://minio:9000 http://127.0.0.1:9000 http://localhost:9000; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://openapi.alipay.com https://openapi-sandbox.dl.alipaydev.com" always;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://gateway:8080;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
