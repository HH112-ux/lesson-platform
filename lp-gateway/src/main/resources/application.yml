server:
  port: 8080

spring:
  application:
    name: lp-gateway
  cloud:
    gateway:
      metrics:
        enabled: true
      # Domain routes. Each route keeps its domain segment (/api/v1/{domain}/**) and the
      # resource oriented paths already documented in engineering-plan chapter 5. Downstream
      # URIs are overridden per environment through LP_*_SERVICE_URI variables.
      routes:
        - id: auth-service
          uri: ${LP_AUTH_SERVICE_URI:http://localhost:8101}
          predicates:
            - Path=/api/v1/user/**,/api/v1/auth/**,/api/v1/users/**
        - id: course-service
          uri: ${LP_COURSE_SERVICE_URI:http://localhost:8102}
          predicates:
            - Path=/api/v1/course/**,/api/v1/categories/**,/api/v1/courses/**,/api/v1/teacher/**
        - id: trade-service
          uri: ${LP_TRADE_SERVICE_URI:http://localhost:8103}
          predicates:
            - Path=/api/v1/trade/**,/api/v1/cart/**,/api/v1/coupons/**,/api/v1/orders/**,/api/v1/payments/**,/api/v1/refunds/**,/api/v1/reconcile/**
        - id: learn-service
          uri: ${LP_LEARN_SERVICE_URI:http://localhost:8104}
          predicates:
            - Path=/api/v1/learning/**,/api/v1/lessons/**
        - id: ugc-service
          uri: ${LP_UGC_SERVICE_URI:http://localhost:8105}
          predicates:
            - Path=/api/v1/ugc/**,/api/v1/comments/**,/api/v1/favorites/**,/api/v1/reports/**
        - id: admin-service
          uri: ${LP_ADMIN_SERVICE_URI:http://localhost:8106}
          predicates:
            - Path=/api/v1/admin/**
        - id: ai-service
          uri: ${LP_AI_SERVICE_URI:http://localhost:8107}
          predicates:
            - Path=/api/v1/ai/**

# Trusted identity handling. Public paths skip verification; every other path needs a valid
# RS256 access token in hard mode. Keys are generated by scripts/gen-jwt-keys.sh into
# infra/jwt (gitignored); startup fails when the public key path is blank.
lp:
  identity:
    enforce-mode: ${LP_IDENTITY_ENFORCE_MODE:hard}
    inject-enabled: true
    # Only account entry and token endpoints are public. /api/v1/auth/me stays protected so the
    # gateway can inject X-User-Id before the auth service reads it.
    whitelist:
      - /api/v1/auth/register
      - /api/v1/auth/miniapp-login
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      # Local mock payment provider callback: opened by the browser as a redirect, so it carries
      # no access token. The HMAC signature is the credential and is verified by trade-service.
      - /api/v1/payments/mock/callback
      # Alipay asynchronous notification: called by Alipay, never by a browser, so it cannot carry
      # an access token. trade-service verifies the channel signature before applying the result.
      - /api/v1/payments/alipay/notify
      - /actuator/**
      - /error
    # Catalog pages are readable without a token; a valid token is still verified so the
    # response can carry the owned flag. Writes under these prefixes do not exist.
    optional-auth:
      - /api/v1/courses/**
      - /api/v1/categories/**
      # The purchase page may be opened in a browser without a session; the ticket is the
      # credential. A valid token is still verified so a different user is rejected.
      - /api/v1/orders/purchase-ticket/redeem
    jwt:
      issuer: auth-service
      public-key-path: ${LP_JWT_PUBLIC_KEY_PATH:}
  # Per-instance token bucket for /api/v1/**, keyed by X-User-Id or the trusted client IP.
  # The bucket starts full, so limit-per-minute is also the burst capacity. With N replicas the
  # cluster admits up to limit-per-minute * N per key per minute. A non positive value fails
  # startup. /internal/** is not routed here and non /api/v1/ paths are skipped.
  rate-limit:
    gateway:
      enabled: ${LP_GATEWAY_RATE_LIMIT_ENABLED:true}
      limit-per-minute: ${LP_GATEWAY_RATE_LIMIT_PER_MINUTE:300}
      trusted-proxies: ${LP_TRUSTED_PROXIES:127.0.0.1,::1}
  # Exact browser origins, comma separated. Empty is only valid under the dev profile, where
  # application-dev.yml supplies the localhost defaults; staging and prod fail startup instead
  # of falling back to localhost. A '*' origin fails startup because credentials are allowed.
  cors:
    enabled: ${LP_CORS_ENABLED:true}
    allowed-origins: ${LP_CORS_ALLOWED_ORIGINS:}
    max-age-seconds: ${LP_CORS_MAX_AGE_SECONDS:3600}

# Health is exposed for the M0-26 acceptance check: curl :8080/actuator/health returns UP.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
