server:
  port: 8080

spring:
  application:
    name: lp-gateway
  cloud:
    gateway:
      metrics:
        enabled: true
      # Domain routes. Each route keeps its domain segment (/api/v1/{domain}/**) and the
      # resource oriented paths already documented in engineering-plan chapter 5. Downstream
      # URIs are overridden per environment through LP_*_SERVICE_URI variables.
      routes:
        - id: auth-service
          uri: ${LP_AUTH_SERVICE_URI:http://localhost:8101}
          predicates:
            - Path=/api/v1/user/**,/api/v1/auth/**,/api/v1/users/**
        - id: course-service
          uri: ${LP_COURSE_SERVICE_URI:http://localhost:8102}
          predicates:
            - Path=/api/v1/course/**,/api/v1/categories/**,/api/v1/courses/**,/api/v1/teacher/**
        - id: trade-service
          uri: ${LP_TRADE_SERVICE_URI:http://localhost:8103}
          predicates:
            - Path=/api/v1/trade/**,/api/v1/cart/**,/api/v1/coupons/**,/api/v1/orders/**,/api/v1/payments/**,/api/v1/refunds/**
        - id: learn-service
          uri: ${LP_LEARN_SERVICE_URI:http://localhost:8104}
          predicates:
            - Path=/api/v1/learn/**,/api/v1/entitlements/**,/api/v1/progress/**,/api/v1/play/**
        - id: ugc-service
          uri: ${LP_UGC_SERVICE_URI:http://localhost:8105}
          predicates:
            - Path=/api/v1/ugc/**,/api/v1/comments/**,/api/v1/favorites/**,/api/v1/reports/**
        - id: admin-service
          uri: ${LP_ADMIN_SERVICE_URI:http://localhost:8106}
          predicates:
            - Path=/api/v1/admin/**
        - id: ai-service
          uri: ${LP_AI_SERVICE_URI:http://localhost:8107}
          predicates:
            - Path=/api/v1/ai/**
        # Miniapp segment: every request under /mp is marked as miniapp source by the gateway.
        - id: miniapp-segment
          uri: ${LP_GATEWAY_MINIAPP_URI:http://localhost:8080}
          predicates:
            - Path=/mp/**

# Trusted identity handling. Public paths skip verification; every other path needs a valid
# RS256 access token in hard mode. Keys are generated by scripts/gen-jwt-keys.sh into
# infra/jwt (gitignored); startup fails when the public key path is blank.
lp:
  identity:
    enforce-mode: ${LP_IDENTITY_ENFORCE_MODE:hard}
    inject-enabled: true
    # Only account entry and token endpoints are public. /api/v1/auth/me stays protected so the
    # gateway can inject X-User-Id before the auth service reads it.
    whitelist:
      - /api/v1/auth/register
      - /api/v1/auth/miniapp-login
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /api/v1/auth/logout
      - /actuator/**
      - /error
    jwt:
      issuer: auth-service
      public-key-path: ${LP_JWT_PUBLIC_KEY_PATH:}

# Health is exposed for the M0-26 acceptance check: curl :8080/actuator/health returns UP.
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
